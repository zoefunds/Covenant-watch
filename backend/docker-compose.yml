version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: covenant
      POSTGRES_PASSWORD: covenant
      POSTGRES_DB: covenant_watch
    ports:
      - "5432:5432"
    volumes:
      - covenant_watch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covenant -d covenant_watch"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional local Redis for offline dev (no Upstash account needed to run
  # `docker compose up`). Production/staging should instead point REDIS_URL
  # (in backend/.env, never committed) at the real Upstash TLS instance --
  # this container is dev-only and has no persistence/auth. See README.md
  # "Local development" for the tradeoff.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://covenant:covenant@postgres:5432/covenant_watch
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://covenant:covenant@postgres:5432/covenant_watch
      # Override REDIS_URL from .env with the compose-local redis service by
      # default, unless you explicitly want this stack talking to real
      # Upstash -- delete this line (and REDIS_URL stays whatever's in .env)
      # if you want that instead.
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  covenant_watch_pgdata:
