# fly.toml app configuration file generated for covenant-watch-backend on 2026-09-21T22:59:52+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'covenant-watch-backend'
primary_region = 'iad'

[build]
[deploy]
  strategy = 'rolling'
  release_command = 'alembic upgrade head'

[env]
  ENV = 'production'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'
    protocol = 'http'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
